<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><style>body { margin: 24px; min-height: 2000px; } hy-modal { --hy-modal-duration: 0ms; } label { display: grid; gap: 8px; } input { padding: 8px; }</style></head>
<body>
  <hy-button id="opener" label="Open modal"></hy-button>
  <button id="outside">Outside action</button>
  <hy-modal id="modal" heading="Publish project" ok-text="Publish">
    <label>Project name<input id="name" value="Moon garden" autofocus /></label>
  </hy-modal>
  <script type="module">
    import { defineModalComponents } from '../../dist/modal.js';
    import { defineButtonComponents } from '../../dist/button.js';
    window.registeredOnImport = Boolean(customElements.get('hy-modal'));
    window.modalEvents = [];
    for (const name of ['modal-open', 'modal-ok', 'modal-cancel', 'modal-close']) document.addEventListener(name, event => modalEvents.push({ type: name, reason: event.detail?.reason }));
    defineModalComponents(); defineModalComponents(); defineButtonComponents();
    document.querySelector('#opener').addEventListener('click', () => document.querySelector('#modal').showModal());
  </script>
</body>
</html>
