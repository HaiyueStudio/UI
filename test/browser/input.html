<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Input browser test</title></head>
<body>
  <hy-input id="affixed" prefix="https://" suffix=".studio" value="haiyue"></hy-input>
  <hy-input id="slotted" value="128"><span slot="prefix" data-testid="slot-prefix">¥</span><strong slot="suffix" data-testid="slot-suffix">CNY</strong></hy-input>
  <hy-input id="number" type="number" value="1" min="0" max="2" step="0.5" required></hy-input>
  <hy-input id="search" type="search" prefix="⌕" suffix="assets" placeholder="Search" search-label="Search assets"></hy-input>
  <output id="events"></output>
  <script type="module">
    import { defineInputComponents } from '../../dist/input.js';
    defineInputComponents();
    const events = document.querySelector('#events');
    for (const input of document.querySelectorAll('hy-input')) {
      for (const name of ['value-change', 'search']) input.addEventListener(name, event => { events.textContent += `${name}:${JSON.stringify(event.detail)}\n`; });
    }
  </script>
</body>
</html>
