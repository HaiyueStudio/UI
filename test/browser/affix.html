<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { margin: 0; }
    .space { height: 180px; }
    .long { height: 1600px; }
    hy-affix { width: 240px; margin-left: 30px; }
    .bar { display: block; width: 100%; height: 40px; border: 0; background: #345; color: white; }
  </style>
</head>
<body>
  <div class="space"></div>
  <hy-affix id="affix" offset-top="12"><button class="bar">Publish actions</button></hy-affix>
  <div class="long"></div>
  <pre id="events"></pre>
  <script type="module">
    import { defineAffixComponents } from '../../dist/affix.js';
    defineAffixComponents();
    affix.addEventListener('affix-change', event => { events.textContent += `${event.detail.affixed}\n`; });
  </script>
</body>
</html>
