<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameEngine UI - Checkbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: start;
      gap: 16px;
      padding: 24px;
      background: #0d1118;
      color: #d8e2f2;
      font-family: system-ui, sans-serif;
    }
    .stack {
      display: grid;
      gap: 12px;
      width: 260px;
    }
    pre {
      width: 360px;
      min-height: 88px;
      margin: 0;
      padding: 12px;
      border: 1px solid #2a3444;
      border-radius: 6px;
      background: #141a24;
      color: #b9c8df;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="stack">
    <ge-checkbox id="basic" label="Enable shadows" value="shadows"></ge-checkbox>
    <ge-checkbox id="checked" label="Use physics" value="physics" checked></ge-checkbox>
    <ge-checkbox id="mixed" label="Partial selection" value="partial" indeterminate></ge-checkbox>
    <ge-checkbox label="Disabled" disabled></ge-checkbox>
  </div>
  <pre id="log">Toggle a checkbox.</pre>

  <script type="module">
    import { defineHaiyueUI } from '../../dist/index.js';

    defineHaiyueUI();

    const log = document.getElementById('log');
    document.addEventListener('checked-change', event => {
      log.textContent = JSON.stringify(event.detail, null, 2);
    });
  </script>
</body>
</html>
