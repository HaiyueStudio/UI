<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameEngine UI - Split</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0d1118;
      color: #d8e2f2;
      font-family: system-ui, sans-serif;
    }
    hy-split {
      width: 100vw;
      height: 100vh;
    }
    .pane {
      height: 100%;
      padding: 12px;
      background: #141a24;
      border: 1px solid #252f3f;
    }
    .pane.alt {
      background: #101620;
    }
    .title {
      margin: 0 0 10px;
      font-size: 13px;
      color: #ffffff;
    }
    .box {
      height: calc(100% - 26px);
      border: 1px dashed #334257;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #8fa7c8;
      font-size: 12px;
    }
    #status {
      position: fixed;
      right: 12px;
      bottom: 12px;
      padding: 8px 10px;
      border: 1px solid #2a3444;
      border-radius: 6px;
      background: rgba(10,14,20,0.82);
      color: #c8d3e4;
      font: 12px monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <hy-split id="main" direction="horizontal" ratio="0.28" min-first="180" min-second="260">
    <div class="pane" slot="first">
      <h2 class="title">Left Pane</h2>
      <div class="box">Hierarchy / assets</div>
    </div>

    <hy-split id="nested" slot="second" direction="vertical" ratio="0.68" min-first="180" min-second="140">
      <div class="pane alt" slot="first">
        <h2 class="title">Viewport</h2>
        <div class="box">Drag the horizontal bar below</div>
      </div>
      <div class="pane" slot="second">
        <h2 class="title">Console</h2>
        <div class="box">Logs / timeline</div>
      </div>
    </hy-split>
  </hy-split>

  <div id="status"></div>

  <script type="module">
    import { defineSplitComponents } from '../../dist/split.js';

    defineSplitComponents();

    const main = document.getElementById('main');
    const nested = document.getElementById('nested');
    const status = document.getElementById('status');

    function renderStatus() {
      status.textContent = `main ratio: ${main.ratio.toFixed(2)}\nnested ratio: ${nested.ratio.toFixed(2)}`;
    }

    main.addEventListener('ratio-change', renderStatus);
    nested.addEventListener('ratio-change', renderStatus);
    renderStatus();
  </script>
</body>
</html>
