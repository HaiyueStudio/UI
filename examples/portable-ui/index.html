<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haiyue · 共享组件</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1424;color:#e7edff;font:15px/1.5 system-ui,sans-serif}main{max-width:1024px;margin:auto;padding:24px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:22px;letter-spacing:.03em;margin:0}header p{color:#a6b4d0;margin:6px 0 0}nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{padding:9px 14px;border:1px solid #425276;border-radius:10px;background:#1b2741;color:#e7edff;font:inherit;cursor:pointer}nav button:focus-visible{outline:2px solid #7ca6ff}
#app{border:1px solid #334566;border-radius:18px;overflow:hidden;box-shadow:0 18px 80px #060b1666}footer{margin-top:18px;color:#a6b4d0;font-size:13px}#status{min-height:24px}a{color:#9ebcff}
@media(max-width:560px){header{align-items:flex-start;flex-direction:column}main{padding:16px 10px}}
</style></head><body><main><header><div><h1>共享组件 · 创作面板</h1><p>设置、输入与预览，使用同一份页面状态。</p></div><nav aria-label="显示设置"><button id="theme">切换浅色</button><button id="direction">切换 RTL</button><button id="font">放大文字</button></nav></header>
<div id="app"></div><footer><div id="status" role="status" aria-live="polite">准备就绪</div><a href="../">返回组件目录</a> · WebComponent 适配示例</footer></main>
<script type="module" src="./main.js"></script></body></html>
